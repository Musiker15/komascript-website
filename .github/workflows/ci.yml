# =============================================================================
# CI: Lint, Type-Check, Build, Vitest, Playwright (alle Branches + PRs)
# -----------------------------------------------------------------------------
# Trigger-Logik:
#   • push    auf jede Branch        → CI läuft (auch auf main, parallel zu Deploy)
#   • pull_request gegen main/develop → CI läuft
#
# Bei PRs aus dem GLEICHEN Repo würde sowohl push als auch pull_request feuern.
# Die concurrency-Gruppe dedupliziert das: gleicher ref → laufender Job wird
# gecancelled und durch den neuen ersetzt.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ["**"]

# Least-Privilege: der validate-Job liest nur den Code aus (checkout + build).
# Kein Schreibzugriff auf Repo-Inhalte, Deployments o. Ä. nötig.
permissions:
  contents: read

concurrency:
  # Eindeutig pro Workflow + ref + event-quelle, verhindert Doppel-Runs
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm-Version kommt aus package.json -> "packageManager": "pnpm@x.y.z"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content (Frontmatter)
        run: pnpm run validate:content

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Test (Vitest)
        run: pnpm test --run

      # Chromium only, and in this job on purpose rather than a separate one:
      # the E2E specs run against the production build made a few steps above.
      # A second job would have to build it again.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (Playwright)
        # Starts `next start -p 3218` itself, see webServer in
        # playwright.config.ts. Covers anchors, status codes, the language
        # switch, scroll position after navigation and CSP violations, all of
        # which only show on the running site.
        run: pnpm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
