# =============================================================================
# pnpm-Workspace-Config
# -----------------------------------------------------------------------------
# Trotz fehlender Workspace-Packages nutzt pnpm 10+ diese Datei für die globale
# Konfiguration (Build-Trust und Overrides).
# =============================================================================

# Postinstall-Scripts: Welche Pakete dürfen ihre Build-Scripts ausführen?
# (pnpm 10+ blockiert sie standardmäßig, ein Security-Feature)
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive Dependency-Overrides
# -----------------------------------------------------------------------------
# Zwingt bestimmte Versionen für transitive Pakete, unabhängig davon, was
# Parent-Pakete (z.B. vitest, tsx) nominell verlangen. Wird genutzt um
# Security-Patches durchzusetzen, ohne auf einen Parent-Bump warten zu müssen.
overrides:
  # CVE: server.fs.deny bypass on Windows alternate paths (high) +
  # launch-editor NTLMv2 hash disclosure via UNC path (medium).
  # Beide sind in vite 8.0.16 gepatcht. Exakt gepinnt (gleiche 8.0.x-Minor
  # wie zuvor, nur der Security-Patch). Ein Range-Override wurde von pnpm
  # hier nicht zuverlässig neu aufgelöst.
  #
  # GHSA-587h-7wmj-h5pm (high), GHSA-698v-4r3x-3vcv und GHSA-r825-w8mm-5pxw
  # (medium): betroffen bis 8.1.5, gepatcht in 8.1.6. Pin deshalb auf die
  # neueste 8.x angehoben, weiter exakt und innerhalb von Major 8.
  vite: 8.3.5

  # CVE: XSS via Unescaped </style> in CSS Stringify Output (< 8.5.0) sowie ein
  # weiteres Advisory, das erst in 8.5.18 gepatcht ist.
  #
  # GHSA-fxqj-rqcc-2cmp (medium): unvollstaendiger Fix von GHSA-6g55-p6wh-862q,
  # ein angreifergesteuertes sourceMappingURL liest beliebige .map-Dateien, wenn
  # `from` nicht gesetzt ist. Betroffen: <= 8.5.22, gepatcht in 8.5.23. Die
  # aufgeloeste Version liegt durch #27 schon darueber, die Untergrenze zieht
  # nach, damit sie nicht zurueckfallen kann.
  postcss: '>=8.5.23'

  # CVE: esbuild erlaubt arbitrary file read beim Dev-Server unter Windows.
  # Gepatcht in 0.28.1. Bounded auf 0.28.x, damit vite 8 kompatibel bleibt.
  esbuild: '>=0.28.1 <0.29'

  # CVE: js-yaml Quadratic-complexity DoS beim Merge-Key-Handling via
  # wiederholte Aliases. Gepatcht in 3.15.0 (3.x) bzw. 4.2.0 (4.x).
  #
  # GHSA-5p4m-2wfm-xmqj (high): dieselbe Klasse in der !!omap-Aufloesung, der
  # Fix zu CVE-2026-59870 war auf keinen der beiden Zweige zurueckportiert.
  # Betroffen: >= 3.0.0 < 3.15.1 und >= 4.0.0 < 4.3.1. Untergrenzen deshalb
  # auf 3.15.1 und 4.3.1 angehoben.
  #
  # Scoped + gebounded, damit der 3.x-Consumer (gray-matter, verlangt ^3.13.1)
  # nicht auf die inkompatible 4.x/5.x-API springt und der 4.x-Consumer
  # (@eslint/eslintrc, verlangt ^4.1.0) innerhalb 4.x bleibt.

  # CVE-2026-33327/33328/35590/35591: sharp erbt Schwachstellen aus libvips,
  # gepatcht in sharp 0.35.0. Next 16.2.x fordert nominell ^0.34.5, deshalb der
  # Override. Bounded auf 0.35.x, damit ein späterer Major nicht ungeprüft
  # hereinrutscht. sharp wird von next/image für die Bildoptimierung genutzt.
  # GHSA-rgj7-g3m4-5g8c (high) ist erst in 0.35.4 gepatcht, die Untergrenze
  # zieht nach.
  sharp: '>=0.35.4 <0.36'

  # CVE: brace-expansion ReDoS. Gepatcht in 1.1.16 (1.x) bzw. 2.0.3 (2.x).
  # Kommt nur über Dev-Werkzeuge herein, wird aber sauber mitgezogen.
  # GHSA-q2hr-2g5m-vwhr (medium) betrifft 1.x bis 1.1.20, gepatcht in 1.1.21.
  brace-expansion@1: '>=1.1.21 <2'

  # GHSA-rj75-hqrm-r3gf (moderate): quadratische Laufzeit beim Parsen flacher
  # Selektoren, gepatcht erst in postcss-selector-parser 7.1.6. Einziger
  # Consumer ist @tailwindcss/typography, das exakt 6.0.10 pinnt. Der Sprung
  # auf 7.x ist geprüft (24.10.2026): Checksummen über .next/static und
  # .next/server mit 6.0.10 und 7.1.7 verglichen. Alles unter .next/static,
  # auch das CSS, ist Byte für Byte gleich. Abweichend sind nur die Dateien, die
  # sich auch zwischen zwei Builds ohne Änderung unterscheiden (zufällige
  # Build-IDs), und die Trace-Listen (.nft.json), die den Paketpfad samt Version
  # enthalten.
  # Scoped auf das Plugin und gebounded auf 7.x.
  '@tailwindcss/typography>postcss-selector-parser': '>=7.1.6 <8'
